global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "heart_disease_api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000", "host.docker.internal:8000"]
        labels:
          app: "heart-disease-prediction"
          env: "production"
