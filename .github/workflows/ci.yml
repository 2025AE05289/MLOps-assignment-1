name: CI/CD Pipeline — Heart Disease MLOps

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Job 1: Lint ────────────────────────────────────────────────────
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting dependencies
        run: pip install flake8

      - name: Run flake8 linter
        run: |
          echo "=== Running flake8 ==="
          flake8 src/ app.py tests/ --max-line-length=120 --statistics --count \
            --ignore=E501,W503,E203,W293,E402

  # ── Job 2: Unit Tests ──────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset
        run: python data/download_data.py

      - name: Run preprocessing (generate test data)
        run: python -c "from src.data_preprocessing import preprocess_data; preprocess_data()"

      - name: Run training (generate model artifacts)
        run: python src/train.py

      - name: Run unit tests with coverage
        run: |
          echo "=== Running Pytest ==="
          pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-report=html:output/coverage_report

      - name: Upload test coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: output/coverage_report/
          retention-days: 14

  # ── Job 3: Train & Package ─────────────────────────────────────────
  train:
    name: Train & Package Model
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset
        run: python data/download_data.py

      - name: Generate EDA Visualizations
        run: python src/eda.py

      - name: Run full training pipeline
        run: python src/train.py

      - name: Upload trained model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            output/models/
            output/figures/model_comparison.png
          retention-days: 30

      - name: Upload EDA figures
        uses: actions/upload-artifact@v4
        with:
          name: eda-figures
          path: output/figures/
          retention-days: 30

      - name: Training summary
        run: |
          echo "=== Training Complete ==="
          echo "Model metadata:"
          cat output/models/model_metadata.json
          echo ""
          echo "Artifacts saved:"
          ls -la output/models/
